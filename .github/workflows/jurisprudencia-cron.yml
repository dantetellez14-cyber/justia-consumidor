name: Jurisprudencia Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6am UTC
  workflow_dispatch:        # Also triggerable manually from GitHub UI

# NOTE: GitHub Actions is intentionally used here instead of Vercel Cron Jobs.
# Reason: the scrape step requires Playwright/Chromium (~300 MB, full browser),
# and the full pipeline can run 20-30 min — both exceed Vercel Function constraints
# (no native Playwright support, 300 s max timeout). GitHub Actions is the correct
# runtime for this workload.

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      # Supabase (shared across all steps)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scrape public sources
        run: npm run scrape:jurisprudencia
        env:
          NODE_ENV: production

      - name: Normalize with Gemini (CI mode — no Ollama fallback)
        run: npm run normalize:jurisprudencia
        # CI=true is set automatically by GitHub Actions.
        # The script detects this and stops gracefully if Gemini quota is hit
        # instead of trying to reach Ollama (unavailable in CI).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Seed Pinecone (incremental)
        run: npm run seed:jurisprudencia
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: justia-jurisprudencia

      - name: Pipeline summary
        if: always()
        run: |
          echo "## 📚 Jurisprudencia Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cases are stored in Supabase \`jurisprudencia_cases\` table." >> $GITHUB_STEP_SUMMARY
          echo "Review new cases at: https://supabase.com/dashboard/project/lwefezjoqeesbjdgublt/editor" >> $GITHUB_STEP_SUMMARY
